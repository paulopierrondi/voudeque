<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>VouDeQue — App screens (handoff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,800;1,6..96,400;1,6..96,600&family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #D1392E;
    --bone: #F8F4EC;
    --paper: #F1ECDF;
    --linen: #E9E2D1;
    --ink: #1A1714;
    --ash: #6B655B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bone);
    color: var(--ink);
    font-family: "Geist", system-ui, sans-serif;
    padding: 64px 48px;
  }
  .head { max-width: 1400px; margin: 0 auto 56px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid rgba(26,23,20,0.18); padding-bottom: 18px; }
  .head h1 { font-family: "Bodoni Moda", serif; font-weight: 800; font-size: 56px; font-stretch: 75%; letter-spacing: -0.03em; }
  .head .meta { font-family: "Geist Mono", monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ash); }
  .grid {
    max-width: 460px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 64px;
  }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .card .label {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid rgba(26,23,20,0.18); padding-bottom: 8px;
  }
  .card .label .ttl { font-family: "Bodoni Moda", serif; font-weight: 400; font-style: italic; font-size: 24px; }
  .card .label .nm { font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); }
  .stage { background: var(--accent); padding: 24px; display: flex; justify-content: center; }
  #screens-root .screens-strip { display: contents; }
  #screens-root .screen-meta { display: none; }
  #screens-root .screen-card { width: auto; }
</style>
</head>
<body>

<div class="head">
  <h1>VOUDEQUE — APP</h1>
  <div class="meta">Handoff · Maio 2026 · 4 telas-chave · 360 × 780</div>
</div>

<div class="grid" id="grid"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Same components from the landing -->
<script type="text/babel" src="../ios-frame.jsx"></script>
<script type="text/babel" src="../screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
  // Reuse the four screen components defined in screens.jsx.
  // The screens.jsx auto-mounts a strip into #screens-root if it exists,
  // but here we render each screen individually inside cards.
  function VdqHandoffGrid() {
    const accent = '#D1392E';
    const cards = [
      { ttl: 'Capa',      nm: 'PÁG. 003 / HOME',      el: <VdqHomeScreen     accent={accent} /> },
      { ttl: 'Briefing',  nm: 'PÁG. 014 / GERAR',     el: <VdqGenerateScreen accent={accent} /> },
      { ttl: 'Editorial', nm: 'PÁG. 022 / LOOK',      el: <VdqResultScreen   accent={accent} /> },
      { ttl: 'Em pauta',  nm: 'PÁG. 022 / FEED',      el: <VdqFeedScreen     accent={accent} /> },
    ];
    return (
      <React.Fragment>
        {cards.map((c, i) => (
          <div className="card" key={i}>
            <div className="label">
              <span className="ttl">{c.ttl}</span>
              <span className="nm">{c.nm}</span>
            </div>
            <div className="stage">
              <IOSDevice width={300} height={650}>{c.el}</IOSDevice>
            </div>
          </div>
        ))}
      </React.Fragment>
    );
  }
  (function mount() {
    function tryMount() {
      if (!window.IOSDevice || !window.VdqHomeScreen) return setTimeout(tryMount, 80);
      ReactDOM.createRoot(document.getElementById('grid')).render(<VdqHandoffGrid />);
    }
    tryMount();
  })();
</script>

</body>
</html>
